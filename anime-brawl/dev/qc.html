<!doctype html><html><body style="margin:0;background:#223;overflow:hidden"><script type="module">
// Quality-control view: characters in close-up (lobby quality) and in the real battle camera.
import * as THREE from 'three';
import { buildCharacter } from '../src/render/model.js';
import { animate } from '../src/render/anim.js';
import { ROSTER } from '../src/data/index.js';
import { lookFor } from '../src/game/fighter.js';
const qs = new URLSearchParams(location.search);
const ids = (qs.get('ids') || 'goku,gojo,ichigo').split(',');
const form = qs.get('form') || 'base', view = qs.get('view') || 'close', W = innerWidth, H = innerHeight;
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(W, H); r.shadowMap.enabled = true; r.outputColorSpace = THREE.SRGBColorSpace; document.body.appendChild(r.domElement);
const s = new THREE.Scene(); s.background = new THREE.Color(view === 'game' ? 0xc8a878 : 0x2a2458);
s.add(new THREE.HemisphereLight(0xfff8e8, 0x8a7a5a, 1.15));
const sun = new THREE.DirectionalLight(0xfff4e0, 2.1); sun.position.set(-6, 14, 8); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8 }); s.add(sun);
if (view !== 'game') { const rim = new THREE.DirectionalLight(0x9ad8ff, 1.4); rim.position.set(-4, 3, -4); s.add(rim); }
const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshToonMaterial({ color: view === 'game' ? 0xc8a878 : 0x3a3268 })); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; s.add(floor);
const rigs = [];
const t0 = performance.now();
ids.forEach((id, i) => {
  const def = ROSTER.find(c => c.id === id);
  const { group, rig } = buildCharacter(lookFor(def, null, form), { quality: view === 'game' ? 'lo' : 'hi' });
  const sp = view === 'game' ? 1.6 : 1.25;
  group.position.x = (i - (ids.length - 1) / 2) * sp; group.rotation.y = view === 'game' ? 0 : 0.35;
  group.traverse(o => { if (o.isMesh) o.castShadow = true; });
  s.add(group); rigs.push(rig);
});
console.log('build ms', Math.round(performance.now() - t0));
const cam = new THREE.PerspectiveCamera(view === 'game' ? 40 : 28, W / H, 0.1, 100);
if (view === 'game') { cam.position.set(0, 17.5 * 0.55, 8.6 * 0.55); cam.lookAt(0, 0, -0.5); }
else { const n = ids.length; cam.position.set(0, 1.25, 2.6 + n * 1.05); cam.lookAt(0, 0.8, 0); }
const pose = qs.get('pose');
for (let k = 0; k < 30; k++) rigs.forEach(rg => animate(rg, 0.033, { move: pose === 'run' ? 1 : 0, action: pose === 'attack' ? { name: 'slash', t: 0.35 } : null }));
r.render(s, cam);
window.__done = true;
</script></body></html>
