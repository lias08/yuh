<!doctype html><html><body style="margin:0;background:#223"><script type="module">
import * as THREE from 'three';
import { buildCharacter } from '../src/render/model.js';
import { ROSTER } from '../src/data/index.js';
import { lookFor } from '../src/game/fighter.js';
const r = new THREE.WebGLRenderer({antialias:true}); r.setSize(1400,700); document.body.appendChild(r.domElement); r.outputColorSpace = THREE.SRGBColorSpace;
const s = new THREE.Scene(); s.background=new THREE.Color(0x8fb8e8);
const cam = new THREE.PerspectiveCamera(30, 2, 0.1, 100);
s.add(new THREE.HemisphereLight(0xffffff,0x667799,1.2)); const d=new THREE.DirectionalLight(0xffffff,2.2); d.position.set(3,6,5); s.add(d);
const ids = (new URLSearchParams(location.search).get('ids')||'yuji,gojo,sukuna,megumi,todo,nanami,toji,mahito,yuta,kashimo').split(',');
const form = new URLSearchParams(location.search).get('form')||'base';
ids.forEach((id,i)=>{ const def=ROSTER.find(c=>c.id===id); const {group}=buildCharacter(lookFor(def,null,form)); group.position.x=(i-(ids.length-1)/2)*1.35; group.rotation.y=0.25; s.add(group); });
cam.position.set(0,1.6,13.2); cam.lookAt(0,1.0,0);
r.render(s,cam);
</script></body></html>
