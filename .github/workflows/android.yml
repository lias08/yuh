name: Build Elixir Tracker APK

on:
  push:
    paths:
      - "ElixirTracker/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ElixirTracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Android SDK ist auf ubuntu-latest vorinstalliert (ANDROID_HOME)
      - name: Kartenbilder + Elixierkosten laden (RoyaleAPI)
        run: |
          pip install --quiet pillow
          python3 tools/fetch_cards.py
      - name: Build & test
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ElixirTracker.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ElixirTracker-apk
          path: ElixirTracker/ElixirTracker.apk
      - name: Release mit APK veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: elixir-tracker-latest
          name: Elixir Tracker (neueste Version)
          body: "ElixirTracker.apk herunterladen und auf dem Android-Handy installieren. Build von ${{ github.sha }}"
          prerelease: true
          make_latest: false
          files: ElixirTracker/ElixirTracker.apk
